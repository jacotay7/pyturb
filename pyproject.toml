[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyturb"
version = "2.0.0"
description = "Fast, GPU-optional atmospheric phase screens for adaptive optics."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jacob Taylor", email = "jacobataylor7@gmail.com" }]
requires-python = ">=3.10"
# aocore (stack conventions: coordinates, constants, OPD/phase) and aobasis
# (the Zernike basis) are pure Python on NumPy/SciPy; their floors set the
# NumPy/SciPy floors below.
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "threadpoolctl>=3",
    "aocore>=0.1.1",
    "aobasis>=2.0",
]
keywords = [
    "adaptive-optics",
    "atmosphere",
    "turbulence",
    "phase-screen",
    "kolmogorov",
    "von-karman",
    "astronomy",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Environment :: GPU :: NVIDIA CUDA",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/jacotay7/pyturb"
Documentation = "https://jacotay7.github.io/pyturb/"
Source = "https://github.com/jacotay7/pyturb"
Changelog = "https://github.com/jacotay7/pyturb/blob/main/CHANGELOG.md"
Issues = "https://github.com/jacotay7/pyturb/issues"

[project.optional-dependencies]
# CuPy 14 compiles its kernels at runtime and needs the CUDA headers; the
# ``ctk`` extra pulls them in as wheels so no system CUDA toolkit is required.
# CuPy for CUDA 11 stops at 13.x, which has no ``ctk`` extra.
cuda11 = ["cupy-cuda11x"]
cuda12 = ["cupy-cuda12x[ctk]"]
cuda13 = ["cupy-cuda13x[ctk]"]
# Optional Numba JIT acceleration of the CPU frozen-flow hot paths (spectral
# layer sum, extruder bicubic readout). pyturb runs without it (NumPy
# fallback); with it the CPU frame rate is several times higher.
accel = ["numba>=0.58"]
test = ["pytest>=7", "pytest-cov"]
fits = ["astropy>=5"]
plot = ["matplotlib>=3.5"]
docs = ["mkdocs-material>=9", "mkdocstrings[python]>=0.24"]
# Optical-propagation packages exercised by the docs/interop.md recipes
# (tests/test_docs.py runs them when installed).
interop = ["hcipy", "poppy"]
# Third-party libraries used only by benchmarks/bench_compare.py for the
# head-to-head comparison; not needed to use pyturb.
compare = ["aotools", "soapy", "hcipy"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyturb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: test needs a CUDA GPU + CuPy; skipped unless run with --run-gpu.",
]

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, flake8-bugbear.
select = ["E", "F", "I", "B"]
# B905 (zip without strict=) only applies from the py310 target; the existing
# zips pair equal-length per-layer sequences by construction.
ignore = ["B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402"]
"validation/*" = ["E402"]
# The immediately-consumed timing lambdas intentionally close over loop vars.
"benchmarks/*" = ["E402", "B023"]

[tool.coverage.run]
# CuPy-only module: CI has no GPU, so it cannot run there. It is exercised by
# the GPU-marked tests (`pytest --run-gpu`), which CONTRIBUTING requires before
# merging GPU changes.
omit = ["*/pyturb/_gpu_spectral.py"]
